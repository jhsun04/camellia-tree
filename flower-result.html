<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>동백꽃 완성</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 16px;
        }
        .card {
            background: white;
            width: 100%;
            max-width: 360px;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            text-align: center;
        }
        .tree-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 6px;
            word-break: keep-all;
        }
        .user-subtext {
            font-size: 0.9rem;
            color: #6e6e73;
            margin-bottom: 20px;
        }
        .tree-container {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0 25px 0;
        }
        .tree-image {
            width: 100%;
            max-width: 200px;
            height: auto;
            object-fit: contain;
            display: block;
        }
        .back-btn {
            width: 100%;
            padding: 12px;
            background-color: #f2f2f7;
            color: #1d1d1f;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
        }
        .back-btn:active {
            background-color: #e5e5ea;
        }

        @media (max-width: 340px) {
            .card { padding: 24px 16px; }
            .tree-title { font-size: 1.15rem; }
            .tree-image { max-width: 160px; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="display-tree-title" class="tree-title">대학교 동백나무</div>
        <div id="display-nickname" class="user-subtext">닉네임 님의 공간</div>

        <div class="tree-container">
            <img src="flower.png" alt="꽃이 핀 나무" class="tree-image">
        </div>

        <!-- 💡 클릭 시 새 페이지(final-tree.html)로 이동하는 버튼 -->
        <button class="back-btn" onclick="location.href='final-tree.html'">처음 나무로 되돌아가기</button>
    </div>

    <script>
        const nickname = localStorage.getItem('userNickname') || '방문자';
        const univ = localStorage.getItem('userUniv') || 'OO대학교';

        document.getElementById('display-tree-title').textContent = `${univ} 동백나무`;
        document.getElementById('display-nickname').textContent = `${nickname} 님의 동백꽃이 피었습니다! 🌺`;
    </script>
</body>
</html>
